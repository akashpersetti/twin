name: Resume Update

on:
  repository_dispatch:
    types: [resume-update]
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: 'S3 bucket containing the uploaded PDF'
        required: true
      s3_key:
        description: 'S3 key of the uploaded PDF'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  update-resume:
    name: Run resume pipeline and push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-resume-update
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download uploaded PDF from S3
        id: fetch_pdf
        run: |
          S3_BUCKET="${{ github.event.client_payload.s3_bucket || inputs.s3_bucket }}"
          S3_KEY="${{ github.event.client_payload.s3_key || inputs.s3_key }}"
          mkdir -p /tmp/resume-upload
          aws s3 cp "s3://${S3_BUCKET}/${S3_KEY}" /tmp/resume-upload/resume.pdf

      - name: Run resume pipeline
        working-directory: .
        run: |
          uv run scripts/update-resume.py /tmp/resume-upload/resume.pdf
        env:
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/resume.ts frontend/public/resume.pdf backend/data/resume.pdf \
            backend/data/facts.json backend/data/summary.txt backend/data/akash_persetti_profile.txt \
            backend/data/profile_index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update resume via admin upload"
          git remote set-url origin "https://x-access-token:${{ secrets.RESUME_PUSH_PAT }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
